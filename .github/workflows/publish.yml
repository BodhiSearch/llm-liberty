name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Extract version from tag
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "tag_version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          IFS='.' read -ra PARTS <<< "$TAG_VERSION"
          NEXT_MINOR=$((${PARTS[1]} + 1))
          echo "next_version=${PARTS[0]}.$NEXT_MINOR.0-dev" >> "$GITHUB_OUTPUT"

      - name: Sync package.json version with tag
        run: pnpm version "${{ steps.version.outputs.tag_version }}" --no-git-tag-version --allow-same-version

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm build

      - name: Publish
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
          npm publish --access public --provenance
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify publish
        run: |
          sleep 10
          npm view @bodhiapp/llm-liberty@${{ steps.version.outputs.tag_version }} version

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Published [@bodhiapp/llm-liberty@${{ steps.version.outputs.tag_version }}](https://www.npmjs.com/package/@bodhiapp/llm-liberty/v/${{ steps.version.outputs.tag_version }}) to npm.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git for version bump
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Bump to next dev version
        run: |
          git fetch --depth=1 origin main
          git checkout -B main origin/main
          pnpm version "${{ steps.version.outputs.next_version }}" --no-git-tag-version
          git add package.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.next_version }} after release"
          git push origin main
