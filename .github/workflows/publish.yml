name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Extract version from tag
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "tag_version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          IFS='.' read -ra PARTS <<< "$TAG_VERSION"
          NEXT_MINOR=$((${PARTS[1]} + 1))
          echo "next_version=${PARTS[0]}.$NEXT_MINOR.0-dev" >> "$GITHUB_OUTPUT"

      - name: Sync package.json version with tag
        run: pnpm version "${{ steps.version.outputs.tag_version }}" --no-git-tag-version --allow-same-version

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm build

      - name: Publish @bodhiapp/llm-liberty
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
          sed -i 's|"name": ".*"|"name": "@bodhiapp/llm-liberty"|' package.json
          npm publish --access public --provenance
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish llm-liberty
        run: |
          sed -i 's|"name": "@bodhiapp/llm-liberty"|"name": "llm-liberty"|' package.json
          pnpm build
          npm publish --access public --provenance
          git restore package.json
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify both packages published
        run: |
          VERSION="${{ steps.version.outputs.tag_version }}"
          START=$(date +%s)
          while true; do
            ELAPSED=$(( $(date +%s) - START ))
            if [ "$ELAPSED" -ge 120 ]; then
              echo "Timeout: packages not visible on npm after 120s"
              exit 1
            fi
            PKG1=$(npm view "@bodhiapp/llm-liberty@$VERSION" version 2>/dev/null || true)
            PKG2=$(npm view "llm-liberty@$VERSION" version 2>/dev/null || true)
            if [ -n "$PKG1" ] && [ -n "$PKG2" ]; then
              echo "@bodhiapp/llm-liberty@$VERSION ✓"
              echo "llm-liberty@$VERSION ✓"
              break
            fi
            echo "[$ELAPSED s] waiting for both packages..."
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Published to npm:
            - [@bodhiapp/llm-liberty@${{ steps.version.outputs.tag_version }}](https://www.npmjs.com/package/@bodhiapp/llm-liberty/v/${{ steps.version.outputs.tag_version }})
            - [llm-liberty@${{ steps.version.outputs.tag_version }}](https://www.npmjs.com/package/llm-liberty/v/${{ steps.version.outputs.tag_version }})
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git for version bump
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Bump to next dev version
        run: |
          git fetch --depth=1 origin main
          git checkout -B main origin/main
          pnpm version "${{ steps.version.outputs.next_version }}" --no-git-tag-version
          git add package.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.next_version }} after release"
          git push origin main
